# MoneyMate production stack: PostgreSQL + the FastAPI app behind gunicorn.
#
#   cp .env.production.example .env      # then fill in real secrets
#   docker compose up -d --build
#
# Order is handled by compose: `db` must pass its healthcheck, then `migrate`
# runs `alembic upgrade head` and exits, then `api` starts. Every `up` re-runs
# `migrate`, which is a no-op when the schema is already at head.
#
# The API listens on 127.0.0.1:8010 ONLY - a reverse proxy (Caddy) in front
# terminates TLS for moneymate.lovee.dpdns.org. 8010 rather than 8000 so it
# cannot collide with other apps on the same host.

name: moneymate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneymate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moneymate}
      # The server's clock zone; dates the app writes come from the business
      # calendar (BUSINESS_TIMEZONE), never from here.
      TZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    # Published on the HOST's loopback only, for backups and for the one-off
    # copy from the old database through an SSH tunnel. Never reachable from
    # the network.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneymate} -d ${POSTGRES_DB:-moneymate}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: brings the schema to head, then exits. The API waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: moneymate-api:latest
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &db_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moneymate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moneymate}
      AUTO_CREATE_TABLES: "false"
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    logging: *logging

  api:
    image: moneymate-api:latest
    restart: unless-stopped
    environment:
      <<: *db_env
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MEDIA_BACKEND: local
      MEDIA_ROOT: /app/media
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-12582912}
      MAX_AUDIO_NOTE_BYTES: ${MAX_AUDIO_NOTE_BYTES:-5242880}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_BIND: 0.0.0.0:8000
    volumes:
      # Photos and voice notes. Without the volume they vanish on rebuild.
      - media_data:/app/media
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *logging

volumes:
  db_data:
  media_data:

networks:
  internal:
    driver: bridge
