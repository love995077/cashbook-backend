[pytest]
# The suite. See tests/conftest.py for which database it runs against:
# SQLite by default, PostgreSQL or MySQL with TEST_DATABASE_URL set.
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    # SQLite stores DECIMAL through a float and SQLAlchemy says so on every
    # use. Known, and the reason the suite also runs on PostgreSQL.
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively:sqlalchemy.exc.SAWarning
markers =
    slow: the property-based ledger test; tens of thousands of requests.
